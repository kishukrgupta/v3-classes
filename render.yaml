# ══════════════════════════════════════════════
# V3 Classes — Render Blueprint
# https://render.com/docs/blueprint-spec
# ══════════════════════════════════════════════

services:
  - type: web
    name: v3classes-backend
    runtime: node
    region: singapore  # Change to your preferred region
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render generates a random value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false  # Set after Vercel deployment
